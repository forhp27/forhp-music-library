<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forhp's music library</title>
    <link rel="icon" href="media/spinning-disk.gif" />
    <link href="style1.css" rel="stylesheet" type="text/css" media="all" />
    <style>
      header {
        background: linear-gradient(135deg, #e74c3c, #531913);
      }

      nav {
        background-color: #ab3528;
      }

      .nav-button:hover {
        background-color: #e74c3c;
      }

      .nav-button.active {
        background-color: #e74c3c;
      }

      .stat-number {
        color: #e74c3c;
      }

      .page-title {
        border-bottom: 2px solid #e74c3c;
      }

      footer {
        background-color: #ab3528;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>forhp's music library</h1>
      <p class="subtitle">my library of music CDs</p>
    </header>

    <nav>
      <a href="index.html" class="nav-button">My CD Collection</a>
      <a href="cd-wishlist.html" class="nav-button active">CDs I Want!</a>
    </nav>

    <div class="container">
      <h2 class="page-title">CD Wishlist</h2>
      <div class="collection-grid">

        <!-- CD items -->

        <div class="collection-item">
          <div class="item-image vinyl-image">
            <img src="media/divine_feminine.jpg" />
          </div>
          <div class="item-details">
            <div class="item-title">The Divine Feminine</div>
            <div class="item-artist">Mac Miller</div>
            <div class="item-year">2016</div>
          </div>
        </div>

        <div class="collection-item">
          <div class="item-image vinyl-image">
            <img src="media/idler_wheel.jpg" />
          </div>
          <div class="item-details">
            <div class="item-title">The Idler Wheel...</div>
            <div class="item-artist">Fiona Apple</div>
            <div class="item-year">2012</div>
          </div>
        </div>

        <div class="collection-item">
          <div class="item-image vinyl-image">
            <img src="media/blue_water_road.png" />
          </div>
          <div class="item-details">
            <div class="item-title">blue water road</div>
            <div class="item-artist">Kehlani</div>
            <div class="item-year">2022</div>
          </div>
        </div>
        
      </div>
    </div>

    <footer>
      <p>hi</p>
      <img src="tailwag.gif" style="width: auto;height: 25%;">
    </footer>

    <script>
      // simple script to handle navigation highlighting
      document.addEventListener("DOMContentLoaded", function () {
        const navButtons = document.querySelectorAll(".nav-button");

        navButtons.forEach((button) => {
          button.addEventListener("click", function () {
            navButtons.forEach((btn) => btn.classList.remove("active"));
            this.classList.add("active");
          });
        });
      });
    </script>
  </body>
</html>
